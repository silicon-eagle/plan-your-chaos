name: CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: forgejo.arda:3000
  IMAGE_NAME: tkelch/plan-your-chaos

jobs:
  validate:
    name: Validate
    runs-on: node-22

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Build application
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
          POSTGRES_APP_USER: build
          POSTGRES_APP_PASSWORD: build
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          TZ: Europe/Amsterdam
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

  build-images:
    name: Build and publish images
    runs-on: node-22
    needs:
      - validate

    if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install --yes docker.io

      - name: Verify Docker
        run: docker info

      - name: Log in to Forgejo registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "${REGISTRY_TOKEN}" |
            docker login "${REGISTRY}" \
              --username "${REGISTRY_USERNAME}" \
              --password-stdin

      - name: Build application image
        run: |
          docker build \
            --target runner \
            --tag "${REGISTRY}/${IMAGE_NAME}:${{ forgejo.sha }}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            .

      - name: Build database tools image
        run: |
          docker build \
            --target database-tools \
            --tag "${REGISTRY}/${IMAGE_NAME}:migrations-${{ forgejo.sha }}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:migrations-latest" \
            .

      - name: Push application images
        run: |
          docker push "${REGISTRY}/${IMAGE_NAME}:${{ forgejo.sha }}"
          docker push "${REGISTRY}/${IMAGE_NAME}:latest"

      - name: Push database tools images
        run: |
          docker push "${REGISTRY}/${IMAGE_NAME}:migrations-${{ forgejo.sha }}"
          docker push "${REGISTRY}/${IMAGE_NAME}:migrations-latest"

  deploy:
    name: Deploy
    runs-on: node-22
    needs:
      - build-images

    if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main'

    steps:
      - name: Install SSH client
        run: |
          apt-get update
          apt-get install --yes openssh-client

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull deployment images
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' \
              && docker compose pull app migrate"

      - name: Start database
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' \
              && docker compose up -d postgres"

      - name: Run migrations and seed
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' \
              && docker compose run --rm migrate"

      - name: Deploy application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' \
              && docker compose up -d --no-deps --force-recreate app"

      - name: Verify deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' \
              && timeout 90 sh -c \
                'until [ \"\$(docker inspect \
                  --format=\"{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}\" \
                  plan-your-chaos 2>/dev/null)\" = \"healthy\" ]; do
                    sleep 3
                done'"

      - name: Show deployed containers
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && docker compose ps --all"

      - name: Remove unused images
        if: success()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker image prune --force"
